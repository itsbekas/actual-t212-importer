name: Deploy
on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
  workflow_dispatch:

# No Watchtower trigger here: this image runs as a one-shot job (a systemd
# timer on the host does `docker compose pull && docker compose run --rm`
# daily), never as a long-running container, so there's nothing for
# Watchtower to watch -- every run already pulls the latest tag itself.
jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/itsbekas/actual-t212-importer:latest
